id: Au_Silicon_15nm
name: "Gold on Silicon 15nm (DESY P03)"
framework: tensorflow
version: "1.15.0"
model:
  format: keras
  # model_path: 允许为空，首次使用需要选择
  model_path: '/Users/zhaiyf/Downloads/Au_ff_h2_0to15_savedmodel'
preprocess:
  entry: preprocess:run
  # Ordered steps for modular preprocessing; you can change order as needed.
  steps:
    - crop
    - resize
    - set_invalid
    - mask
    - cut_columns
    - log_and_normalize
    - mask
    - cut_columns
    - cut_rows
  params:
    crop:
      left: 800
      up: 800
      down: 450
      right: 250
    # Training/validation uses scipy.ndimage.zoom(order=0); bilinear changes
    # individual detector pixels and causes a large shift in this dense model.
    resize:
      shape: [256, 256]
      method: nearest
    # Replace NaN/negative before log
    set_invalid:
      nan: -1
      negative: -1
    # Vertical cut: first 20 columns set to -1
    cut_columns:
      start: 0
      end: 20
      value: -1
    # Bottom band removal: rows 240..256 set to -1
    cut_rows:
      start: 240
      end: 256
      value: -1
    # log(e * intensity / max + eps). The excluded bands match the training
    # Preprocessing.log_and_normalize implementation used by this model.
    log_and_normalize:
      eps: 1e-8
      exclude_from_max:
        columns: [0, 10]
        rows: [240, 256]
    mask:
      apply: true
      path: "assets/mask.npy"
      resize: [256, 256]
      crop_mask:
        left: 0
        up: 0
        down: 0
        right: 0
      mask_value: -1
io:
  input_type: "cbf"
  stack_axis: 0
  input_shape: [1, 256, 256, 1]
outputs:
  type: joint_distribution
  names:
    - "H-R distribution"
    - "H distribution"
    - "R distribution"
  # The saved model was trained with matrix rows=R and columns=H/2.  Expose
  # full particle height H on the physical axis to match the publication.
  axes:
    row:
      key: r
      label: R
      unit: nm
      min: 0.05
      max: 15.0
    column:
      key: h
      label: H
      unit: nm
      min: 0.1
      max: 30.0

  
