[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
    "utils/ML_Fitting_1D_GISAXS/tests",
]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = ["-ra"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    ".gimap_cache",
    "AI_Fitting_Output",
    "trainset_jobs",
    # Imported research records are preserved verbatim, not GUI runtime modules.
    "modules/Fitting_1D_Model/Workflow_v5/development",
    # Frozen upstream model code is checked against its SHA256 manifest instead.
    "modules/Fitting_1D_Model/Workflow_v5/conditional_v2",
]

[tool.ruff.lint]
# Start with syntax errors, invalid control flow, and undefined names. Broader
# style rules can be enabled incrementally as legacy modules are refactored.
select = ["E9", "F63", "F7", "F82"]
