# `pip install .` (or `pip install -e .` in a source folder) installs GIMaP with the core requirements of
# requirements.txt and a `gimap` command (`gimap [FILE_OR_FOLDER ...]`, `gimap --version`). The version is read
# from src/gimap/shared/version.py, the one place it is written. The optional parts keep their own files
# (requirements-tensorflow.txt, requirements-bornagain.txt, requirements-ai.txt).
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gimap"
description = "GIMaP: GISAXS and GIWAXS analysis, a PyQt5 desktop program"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
license = {text = "MIT"}
authors = [{name = "Yufeng Zhai"}]
dynamic = ["version", "dependencies"]

[project.urls]
Homepage = "https://github.com/zyffcc/gisaxs_gui"

[project.scripts]
gimap = "src.gimap.app.launcher:launch"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.qss", "*.svg", "*.css", "*.js", "*.json", "*.npz"]

[tool.setuptools.dynamic]
version = {attr = "src.gimap.shared.version.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = ["-ra"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    ".gimap_cache",
    "AI_Fitting_Output",
    "trainset_jobs",
    # The analysis package of the Sputter page is a release build of research code, run only as a subprocess.
    "utils/sputter_client",
]

[tool.ruff.lint]
# Start with syntax errors, invalid control flow, and undefined names. Broader
# style rules can be enabled incrementally as legacy modules are refactored.
select = ["E9", "F63", "F7", "F82"]
