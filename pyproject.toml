[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = ["-ra"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    ".gimap_cache",
    "AI_Fitting_Output",
    "trainset_jobs",
    # The bundled fit1d kit is frozen research code, imported only inside a job process.
    "utils/gisaxs1d_gui_kit",
    # The analysis package of the Sputter page is a release build of research code, run only as a subprocess.
    "utils/sputter_client",
]

[tool.ruff.lint]
# Start with syntax errors, invalid control flow, and undefined names. Broader
# style rules can be enabled incrementally as legacy modules are refactored.
select = ["E9", "F63", "F7", "F82"]
