            spinning_time_1: 10
            spinning_speed_2: 4000
            spinning_time_2: 30
            antisolvent_volume: 150
            antisolvent_drop_time: 62
            gas_start_time: null
            gas_stop_time: null
          annealing_procedure:
            annealing_type: halogen lamp
            lamp_to_sample_distance: 0.04
            annealing_start: 30
            annealing_power_1: 150
            annealing_time_1: 240
            annealing_power_2: 85
            annealing_time_2: 1260
