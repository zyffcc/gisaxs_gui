name: Desktop release checks
on:
  push:
    branches: [main, 'codex/release-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      GIMAP_SPUTTER_NO_INSTALL: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-release.txt
      - name: Install release and check dependencies
        run: python -m pip install -r requirements-release.txt pytest ruff httpx
      - name: Check application
        run: python tools/check.py --research skip
      - name: Record dependency versions
        if: always()
        run: python -m pip freeze > pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment-${{ matrix.os }}
          path: pip-freeze.txt
