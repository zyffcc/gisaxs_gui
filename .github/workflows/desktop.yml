name: Desktop release checks
on:
  push:
    branches: [main, 'codex/release-*']
  pull_request:
  workflow_dispatch:
    inputs:
      check_scope:
        description: Run the complete suite or the cross-platform release regressions
        type: choice
        options: [full, release-regression]
        default: full
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
      GIMAP_SPUTTER_NO_INSTALL: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-release.txt
      - name: Install release and check dependencies
        run: python -m pip install -r requirements-release.txt pytest ruff httpx
      - name: Install and verify Sputter runtime
        run: python -m pip install -r requirements-sputter.txt
      - name: Check application
        if: github.event_name != 'workflow_dispatch' || inputs.check_scope != 'release-regression'
        run: python tools/check.py --research skip
      - name: Check release regressions
        if: github.event_name == 'workflow_dispatch' && inputs.check_scope == 'release-regression'
        run: python tools/check.py --research skip -- tests/test_help_code.py tests/test_release_help_menu.py tests/test_release_packaging_list.py tests/test_nexus_layout.py tests/test_nexus_followups.py tests/test_nexus_reading.py tests/test_converted_frames_invalid_pixels.py tests/test_analyze_nexus_sources.py tests/test_release2_calibration_files.py tests/test_release_readiness.py
      - name: Record dependency versions
        if: always()
        run: python -m pip freeze > pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment-${{ matrix.os }}
          path: pip-freeze.txt
